<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Würfelspiel 10.000 – Spielstand</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1d2b2f;--muted:#6b7478;--accent:#2f6f4f;--accent-2:#1f4d37;--bad:#b3352b;--gold:#c8962e;--line:#e2d9c8;--chip:#efe9dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:6px}
main{flex:1;overflow-y:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
button{font:inherit;cursor:pointer;min-height:46px;padding:0 14px;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent-2);font-weight:600}
.btn-bad{background:#fbeceb;color:var(--bad);border-color:#efc3bf;font-weight:600}
.btn-small{min-height:38px;font-size:14px;padding:0 12px}
.big{width:100%;min-height:54px;font-size:17px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.field:last-child{margin-bottom:0}
.field input{font:inherit;font-size:16px;color:var(--ink);min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;width:100%}
.seg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.seg button{padding:0;min-height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg{font-size:14px;background:#e8f1eb;color:var(--accent-2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.msg.warn{background:#fbeceb;color:var(--bad)}
.pl{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.pl.active{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(47,111,79,.15)}
.pl .name{font-weight:600;font-size:16px}
.pl .last{font-size:12px;color:var(--muted);margin-top:2px}
.pl .score{margin-left:auto;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--line)}
.badge.gold{background:#f6e7c4}
.panel{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:62dvh;overflow-y:auto}
.turnbar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.turnval{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.lastbox{text-align:right;min-width:110px;background:var(--chip);border-radius:12px;padding:6px 10px}
.lastbox .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.lastbox .l{font-size:11px;color:var(--muted)}
.entries{display:flex;gap:6px;overflow-x:auto;margin-top:8px;min-height:24px;scrollbar-width:none;align-items:center}
.entries::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.grid button{min-height:46px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:0}
.grid button.hot{background:#e8f1eb;border-color:#b9d3c2}
.manual{display:flex;gap:8px;margin-top:8px}
.manual input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.manual button{flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:8px}
.actions button{padding:0 6px;font-size:15px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:36px;display:flex;align-items:center}
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.faces button,.counts button{min-height:40px;font-weight:600;padding:0}
.faces button[aria-pressed=true],.counts button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.result{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.result b{font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.results ol{margin:0;padding-left:20px}
.results li{padding:4px 0;font-size:16px}
.journal{list-style:none;padding:0;margin:0}
.jr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.jr time{color:var(--muted);flex:none;font-size:12px;min-width:130px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style>
</head>
<body>
<div class="app" id="root"></div>

<script>
const KEY = 'wuerfelspiel-10000-db-v1';

const S = {
  phase: 'setup',
  view: 'game',
  count: 3,
  names: [],
  minOpen: 350,
  target: 10000,
  g: null,
  hist: [],
  journal: [],
  archive: [],
  face: 1,
  cnt: 3,
  manual: '',
  msg: '',
  msgWarn: false,
  askNew: false,
  dbOk: true
};

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n){ return Number(n).toLocaleString('de-DE'); }
function fmtTime(t){
  const d = new Date(t);
  return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function setMsg(t, warn){ S.msg = t; S.msgWarn = !!warn; }

/* ---------- Speicher (lokal im Browser) & Verlauf ---------- */
function log(text){
  S.journal.push({ t: new Date().toISOString(), text });
  if (S.journal.length > 3000) S.journal.shift();
}

function persist(){
  const data = {
    settings: { count: S.count, names: S.names, minOpen: S.minOpen, target: S.target },
    phase: S.phase,
    g: S.g,
    hist: S.hist,
    journal: S.journal,
    archive: S.archive
  };
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    S.dbOk = true;
  } catch (e) {
    S.dbOk = false;
  }
}

function loadSaved(){
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  } catch (e) {
    S.dbOk = false;
    return;
  }
  if (!saved) return;
  if (saved.settings) {
    S.count = saved.settings.count || S.count;
    S.names = saved.settings.names || [];
    S.minOpen = saved.settings.minOpen ?? S.minOpen;
    S.target = saved.settings.target || S.target;
  }
  S.archive = saved.archive || [];
  if (saved.phase === 'game' && saved.g) {
    S.phase = 'game';
    S.g = saved.g;
    S.hist = saved.hist || [];
    S.journal = saved.journal || [];
    log('App geöffnet, laufendes Spiel fortgesetzt');
  }
}

function openJournal(){ S.view = 'journal'; render(); }
function closeJournal(){ S.view = 'game'; render(); }

function exportData(){
  const data = {
    exportedAt: new Date().toISOString(),
    currentGame: S.g ? { players: S.g.players, round: S.g.round, target: S.g.target, minOpen: S.g.minOpen } : null,
    journal: S.journal,
    archive: S.archive
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wuerfelspiel-10000-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setMsg('Export wurde erstellt.');
  } catch (e) {
    setMsg('Export ist in diesem Browser nicht möglich.', true);
  }
  render();
}

/* ---------- Einstellungen ---------- */
function syncNames(){
  while (S.names.length < S.count) S.names.push('Spieler ' + (S.names.length + 1));
  S.names.length = S.count;
}
function setCount(n){ S.count = n; render(); }

function renderSetup(){
  syncNames();
  const opts = [2,3,4,5,6,7,8].map(n =>
    `<button aria-pressed="${n===S.count}" onclick="setCount(${n})">${n}</button>`).join('');
  const inputs = S.names.map((n, i) =>
    `<label class="field"><span>Spieler ${i+1}</span><input type="text" maxlength="20" value="${esc(n)}" placeholder="Spieler ${i+1}" oninput="S.names[${i}]=this.value"></label>`).join('');
  const warn = S.dbOk ? '' : `<div class="msg warn">Speichern im Browser ist nicht verfügbar. Daten gehen beim Neuladen verloren.</div>`;
  return `
  <header>
    <div><h1>Würfelspiel 10.000</h1><div class="sub">Spielstand erfassen</div></div>
  </header>
  <main>
    ${warn}
    <section class="card"><h2>Wie viele Spieler?</h2><div class="seg">${opts}</div></section>
    <section class="card"><h2>Namen</h2>${inputs}</section>
    <section class="card"><h2>Regeln</h2>
      <label class="field"><span>Einstieg: Mindestpunkte im ersten Zug</span>
        <input type="number" inputmode="numeric" value="${S.minOpen}" oninput="S.minOpen=parseInt(this.value,10)||0"></label>
      <label class="field"><span>Zielpunktzahl</span>
        <input type="number" inputmode="numeric" value="${S.target}" oninput="S.target=parseInt(this.value,10)||10000"></label>
    </section>
    <button class="btn-primary big" onclick="startGame()">Spiel starten</button>
  </main>`;
}

function startGame(){
  syncNames();
  const players = S.names.map((n, i) => ({
    name: (n || '').trim() || ('Spieler ' + (i+1)),
    score: 0,
    entered: false,
    last: null
  }));
  S.g = { players, cur: 0, turn: 0, entries: [], round: 1, trigger: null, over: false,
          minOpen: S.minOpen, target: S.target, lastCommit: null };
  S.hist = [];
  S.journal = [];
  S.manual = '';
  S.askNew = false;
  S.view = 'game';
  log(`Spiel gestartet: ${players.map(p => p.name).join(', ')} · Ziel ${fmt(S.target)} · Einstieg ${fmt(S.minOpen)}`);
  setMsg('');
  S.phase = 'game';
  render();
}

/* ---------- Spiellogik ---------- */
function snap(){
  S.hist.push(JSON.stringify(S.g));
  if (S.hist.length > 300) S.hist.shift();
}
function undo(){
  if (!S.hist.length) return;
  const who = S.g.players[S.g.cur].name;
  S.g = JSON.parse(S.hist.pop());
  S.askNew = false;
  log(`Rückgängig gemacht (Zug von ${who})`);
  setMsg('Letzte Aktion rückgängig gemacht.');
  render();
}

function addPts(p, label){
  if (!S.g || S.g.over) return;
  p = Math.round(Number(p));
  if (!(p > 0)) { setMsg('Bitte mehr als 0 Punkte eingeben.', true); render(); return; }
  snap();
  const name = S.g.players[S.g.cur].name;
  S.g.turn += p;
  S.g.entries.push({ label, p });
  log(`${name}: +${fmt(p)} (${label}), Zug jetzt ${fmt(S.g.turn)}`);
  S.manual = '';
  setMsg('');
  render();
}

function addManual(){
  const v = parseInt(S.manual, 10);
  addPts(v, 'Manuell');
}

// Drilling: Einser = 1000, sonst Augenzahl x 100; jeder weitere gleiche Würfel verdoppelt
function paschValue(face, cnt){
  const base = face === 1 ? 1000 : face * 100;
  return base * Math.pow(2, cnt - 3);
}
function addPasch(){
  addPts(paschValue(S.face, S.cnt), S.cnt + 'x ' + S.face);
}
function setFace(f){ S.face = f; render(); }
function setCnt(c){ S.cnt = c; render(); }

function bust(){
  if (!S.g || S.g.over) return;
  snap();
  const name = S.g.players[S.g.cur].name;
  log(`${name}: Fehlwurf`);
  S.g.turn = 0;
  S.g.entries.push({ label: 'Fehlwurf', p: 0 });
  endTurn(true);
}
function endBtn(){
  if (!S.g || S.g.over) return;
  snap();
  endTurn(false);
}

function endTurn(bustTurn){
  const g = S.g;
  const p = g.players[g.cur];
  let note;
  if (bustTurn) {
    note = `${p.name}: Fehlwurf, keine Punkte.`;
    p.last = 'Fehlwurf';
  } else if (g.turn === 0) {
    note = `${p.name}: 0 Punkte, Zug beendet.`;
    p.last = '0';
  } else if (!p.entered && g.turn < g.minOpen) {
    note = `${p.name}: ${fmt(g.turn)} Punkte sind unter dem Einstieg (${fmt(g.minOpen)}), die Punkte verfallen.`;
    p.last = 'verfallen (' + fmt(g.turn) + ')';
  } else {
    p.score += g.turn;
    p.entered = true;
    p.last = '+' + fmt(g.turn);
    note = `${p.name} schreibt ${fmt(g.turn)} Punkte gut (Stand ${fmt(p.score)}).`;
  }
  g.lastCommit = { name: p.name, text: p.last };

  if (p.score >= g.target && g.trigger === null) {
    g.trigger = g.cur;
    note += ` ${p.name} hat ${fmt(g.target)} erreicht. Alle anderen haben noch eine letzte Runde!`;
  }

  g.turn = 0;
  g.entries = [];
  const next = (g.cur + 1) % g.players.length;
  if (g.trigger !== null && next === g.trigger) {
    g.over = true;
    note += ' Das Spiel ist beendet.';
  } else {
    if (next === 0) g.round++;
    g.cur = next;
  }
  log(note);
  setMsg(note);
  render();
}

function newGameTap(){
  if (!S.askNew) { S.askNew = true; render(); return; }
  if (S.g) {
    S.archive.push({
      archivedAt: new Date().toISOString(),
      players: S.g.players.map(p => ({ name: p.name, score: p.score })),
      journal: S.journal
    });
  }
  S.phase = 'setup';
  S.view = 'game';
  S.g = null;
  S.hist = [];
  S.journal = [];
  S.askNew = false;
  setMsg('');
  render();
}

/* ---------- Ansicht Spiel ---------- */
function renderGame(){
  const g = S.g;
  const order = g.players.map((p, i) => i).sort((a, b) => g.players[b].score - g.players[a].score);

  const rows = g.players.map((p, i) => {
    const active = !g.over && i === g.cur;
    const tags = [];
    if (!p.entered) tags.push(`<span class="badge">Einstieg ab ${fmt(g.minOpen)}</span>`);
    if (g.trigger === i) tags.push(`<span class="badge gold">Letzte Runde ausgelöst</span>`);
    const last = p.last !== null ? `<div class="last">letzter Zug: ${esc(p.last)}</div>` : '';
    return `<div class="pl ${active ? 'active' : ''}">
      <div><div class="name">${esc(p.name)}</div>${last}<div class="tags">${tags.join('')}</div></div>
      <div class="score">${fmt(p.score)}</div>
    </div>`;
  }).join('');

  const results = g.over ? `
    <section class="card results"><h2>Endstand</h2><ol>
      ${order.map(i => `<li><b>${esc(g.players[i].name)}</b>: ${fmt(g.players[i].score)}</li>`).join('')}
    </ol></section>` : '';

  const msg = S.msg ? `<div class="msg ${S.msgWarn ? 'warn' : ''}" role="status">${esc(S.msg)}</div>` : '';
  const dbWarn = S.dbOk ? '' : `<div class="msg warn">Speichern im Browser ist nicht verfügbar. Daten gehen beim Neuladen verloren.</div>`;

  // Letzter Wert: zuletzt hinzugefügter Wert im aktuellen Zug, sonst letzter abgeschlossener Zug
  const lastEntry = g.entries.length ? g.entries[g.entries.length - 1] : null;
  let lastHtml;
  if (lastEntry) {
    lastHtml = `<div class="v">${lastEntry.p ? '+' + fmt(lastEntry.p) : '0'}</div><div class="l">letzter Wert · ${esc(lastEntry.label)}</div>`;
  } else if (g.lastCommit) {
    lastHtml = `<div class="v">${esc(g.lastCommit.text)}</div><div class="l">${esc(g.lastCommit.name)}, letzter Zug</div>`;
  } else {
    lastHtml = `<div class="v">–</div><div class="l">letzter Wert</div>`;
  }

  const entries = g.entries.length
    ? g.entries.map(e => `<span class="chip">${esc(e.label)}${e.p ? ' +' + fmt(e.p) : ''}</span>`).join('')
    : `<span class="sub">Noch keine Punkte im Zug</span>`;

  const vals = [50,100,150,200,300,350,400,500,600,800,1000,1500];
  const hot = [300,350,400,500,1000];
  const grid = vals.map(v =>
    `<button class="${hot.includes(v) ? 'hot' : ''}" onclick="addPts(${v},'${v}')">${fmt(v)}</button>`).join('');

  const faces = [1,2,3,4,5,6].map(f =>
    `<button aria-pressed="${f===S.face}" onclick="setFace(${f})">${f}</button>`).join('');
  const counts = [3,4,5,6].map(c =>
    `<button aria-pressed="${c===S.cnt}" onclick="setCnt(${c})">${c}×</button>`).join('');

  const panel = g.over ? `
    <div class="panel">
      <button class="btn-primary big" onclick="newGameTap()">${S.askNew ? 'Wirklich neues Spiel starten?' : 'Neues Spiel'}</button>
    </div>` : `
    <div class="panel">
      <div class="turnbar">
        <div><div class="sub">${esc(g.players[g.cur].name)} · Runde ${g.round}</div><div class="turnval" aria-label="Punkte im aktuellen Zug">${fmt(g.turn)}</div></div>
        <div class="lastbox">${lastHtml}</div>
      </div>
      <div class="entries">${entries}</div>
      <div class="grid">${grid}</div>
      <div class="manual">
        <input type="number" inputmode="numeric" min="0" step="5" placeholder="Eigene Punkte, z. B. 353"
          value="${esc(S.manual)}" oninput="S.manual=this.value"
          onkeydown="if(event.key==='Enter'){addManual()}" aria-label="Punkte manuell eingeben">
        <button class="btn-primary" onclick="addManual()">Addieren</button>
      </div>
      <div class="actions">
        <button onclick="undo()" ${S.hist.length ? '' : 'disabled'}>↶ Rückgängig</button>
        <button class="btn-bad" onclick="bust()">Fehlwurf</button>
        <button class="btn-primary" onclick="endBtn()">Zug beenden</button>
      </div>
      <details>
        <summary>Pasch berechnen</summary>
        <div class="faces">${faces}</div>
        <div class="counts">${counts}</div>
        <div class="result"><span>Wert: <b>${fmt(paschValue(S.face, S.cnt))}</b></span>
          <button class="btn-primary btn-small" onclick="addPasch()">Hinzufügen</button></div>
        <div class="hint">Jeder weitere gleiche Würfel verdoppelt den Drillingswert.</div>
      </details>
    </div>`;

  return `
  <header>
    <div><h1>Würfelspiel 10.000</h1><div class="sub">Ziel ${fmt(g.target)} · Einstieg ${fmt(g.minOpen)}</div></div>
    <div class="hbtns">
      <button class="btn-small" onclick="openJournal()">Verlauf</button>
      <button class="btn-small" onclick="newGameTap()">${S.askNew ? 'Sicher?' : 'Neu'}</button>
    </div>
  </header>
  <main>
    ${dbWarn}
    ${msg}
    ${results}
    ${rows}
  </main>
  ${panel}`;
}

function renderJournal(){
  const items = S.journal.slice().reverse().map(e =>
    `<li class="jr"><time>${fmtTime(e.t)}</time><span>${esc(e.text)}</span></li>`).join('')
    || '<li class="sub">Noch keine Einträge.</li>';
  const archive = S.archive.length
    ? `<section class="card"><h2>Archiv</h2><div class="sub">${S.archive.length} beendete oder verworfene Spiele gespeichert. Sie sind im Export enthalten.</div></section>`
    : '';
  const msg = S.msg ? `<div class="msg ${S.msgWarn ? 'warn' : ''}" role="status">${esc(S.msg)}</div>` : '';
  return `
  <header>
    <div><h1>Verlauf</h1><div class="sub">${S.journal.length} Einträge im aktuellen Spiel</div></div>
    <button class="btn-small" onclick="closeJournal()">← Zurück</button>
  </header>
  <main>
    ${msg}
    <button class="btn-primary big" onclick="exportData()">Daten exportieren (JSON)</button>
    <section class="card" style="margin-top:12px"><h2>Protokoll</h2>
      <ol class="journal">${items}</ol>
    </section>
    ${archive}
  </main>`;
}

function render(){
  persist();
  let html;
  if (S.phase === 'setup') html = renderSetup();
  else if (S.view === 'journal') html = renderJournal();
  else html = renderGame();
  document.getElementById('root').innerHTML = html;
}

loadSaved();
render();
</script>
</body>
</html>
